<app-dashboard-shell [navItems]="navItems">
  <h1 class="page-title">Área do professor</h1>

  @if (stats(); as s) {
    <div class="stat-grid">
      <div class="stat-tile">
        <span class="stat-label">Meus cursos</span>
        <strong class="stat-value">{{ s.totalCourses }}</strong>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Módulos</span>
        <strong class="stat-value">{{ s.totalModules }}</strong>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Alunos matriculados</span>
        <strong class="stat-value">{{ s.totalStudents }}</strong>
      </div>
      <div class="stat-tile">
        <span class="stat-label">Matrículas ativas</span>
        <strong class="stat-value">{{ s.totalEnrollments }}</strong>
      </div>
    </div>

    <section class="chart-card">
      <h2>Matrículas nos últimos 14 dias</h2>
      <app-bar-chart [series]="s.enrollmentsByDay" color="#6c4bf4" />
    </section>
  } @else if (loading()) {
    <p class="hint">Carregando estatísticas...</p>
  }
</app-dashboard-shell>
