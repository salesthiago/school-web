<div
  class="auth-screen"
  [class.has-bg]="institution()?.loginBackgroundUrl"
  [style.background-image]="institution()?.loginBackgroundUrl ? 'url(' + institution()!.loginBackgroundUrl + ')' : null"
>
  <div class="auth-card">
    @if (institution()?.logoUrl) {
      <img class="auth-logo" [src]="institution()!.logoUrl" [alt]="institution()!.name" />
    }
    <h1>Entrar</h1>
    <p class="subtitle">Acesse seus cursos</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        E-mail
        <input type="email" formControlName="email" placeholder="voce@email.com" />
      </label>

      <label>
        Senha
        <input type="password" formControlName="password" placeholder="••••••••" />
      </label>

      @if (errorMessage()) {
        <p class="error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="switch">
      Não tem conta? <a routerLink="/auth/register">Cadastre-se</a>
    </p>
  </div>
</div>
