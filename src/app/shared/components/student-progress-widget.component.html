@if (loaded() && hasEnrollments()) {
  <div class="progress-widget">
    <strong class="ds-label">Seu progresso geral</strong>
    <div class="ring" [style.background]="'conic-gradient(var(--ds-accent) ' + percentage() * 3.6 + 'deg, rgba(255,255,255,0.12) 0)'">
      <div class="ring-hole ds-tabular">{{ percentage() }}%</div>
    </div>
    <span class="count">{{ inProgressCount() }} curso{{ inProgressCount() === 1 ? '' : 's' }} em andamento</span>
    <a class="ds-btn ds-btn-glass ds-btn-sm details-btn" routerLink="/student/meus-cursos">Ver detalhes</a>
  </div>
}
